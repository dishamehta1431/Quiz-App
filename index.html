<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="row">
        <div class="card quiz-card shadow-lg">
          <div class="card-body">
            <h1 class="card-title text-center text-success">Quiz</h1>
            <div class="quiz mt-2 d-flex justify-content-between ">
              <h5 class="text-primary" id="qnsNum">Qns 1/2</h5>
              <h5 class="text-danger" id="timeLeft">Time Left 24</h5>
            </div>

            <div id="qns" class="question mt-4 text-center">
              <h2>question will be appear here</h2>
            </div>
            <div class="row mt-5" id="options"></div>

            <button
              class="btn mt-5 next-btn btn-outline-success w-100 mt-5"
              id="nextBtn"
              onclick="nextQns()"
            >
              Next Question
            </button>

            <div class="result">

            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
